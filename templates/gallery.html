<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务A: 滑动交互（翻页）</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0.75rem;
            box-sizing: border-box;
            background-color: #f0f2f5;
            min-height: 100dvh;
        }

        .container {
            padding: 1rem;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        h1, h2, h3 { color: #333; margin-top: 0; text-align: center; }

        video {
            width: 100%;
            height: auto;
            background-color: #000;
            border: 1px solid #ddd;
            border-radius: 12px;
            transform: scaleX(-1);
            margin-top: 1rem;
        }

        #webcam {
            max-width: 300px;
            width: 70%;
            display: block;
            margin: 0 auto;
        }

        #wizard-status {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 1rem;
            transition: all 0.3s ease-in-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            min-height: 1.5em;
        }

        .buttons-container {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .condition-box { flex: 1; }

        #gallery-container {
            width: 100%;
            flex: 1;
            min-height: 260px;
            max-height: 100%;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 0.5rem;
            position: relative;
        }

        #image-strip {
            display: flex;
            height: 100%;
            transition: transform 0.35s ease-in-out;
        }

        .gallery-image {
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        button {
            font-size: 16px;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #28a745;
            color: white;
            transition: background-color 0.3s;
            margin-top: 1rem;
            width: 100%;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .au-button {
            background-color: #007bff;
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
            flex-basis: calc(50% - 10px);
            box-sizing: border-box;
        }

        .au-buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-top: 150px;
            margin-bottom: 150px;
        }

        .nav-buttons a {
            text-decoration: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            background-color: #6c757d;
            color: white;
            width: 90%;
            max-width: 320px;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        #next-task-link {
            background-color: #007bff;
            font-weight: bold;
        }

        #next-task-link:hover { background-color: #0056b3; }

        .hidden { display: none !important; }

        .results { margin-top: 1rem; min-height: 20px; }

        .results p {
            margin: 0.5rem 0;
            font-size: 16px;
            text-align: left;
        }

        .results span {
            font-weight: bold;
            color: #007bff;
        }

        .gesture-display {
            font-size: 1.75rem;
            font-weight: 700;
            color: #333;
            margin-top: 0.2rem;
            margin-bottom: 0.8rem;
            text-align: left;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .gesture-display strong {
            font-size: 1.95rem;
            color: #007bff;
        }

        #live-confidence-box {
            margin-top: 0.45rem;
            margin-bottom: 0.9rem;
            padding: 0.9rem 1rem;
            background: #f8f9fb;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            text-align: left;
            flex-shrink: 0;
        }

        #live-confidence-box p {
            margin: 0.45rem 0;
            line-height: 1.45;
            font-size: 1.18rem;
            color: #333;
        }

        #live-confidence-box .confidence-label {
            font-weight: 700;
            color: #333;
            font-size: 1.15rem;
        }

        #live-confidence-box .confidence-value {
            font-weight: 700;
            color: #007bff;
            font-size: 1.2rem;
        }

        .btn-stop { background-color: #dc3545 !important; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .countdown-active {
            animation: pulse 1s infinite;
        }

        #feedback-step.container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .feedback-form {
            width: 90%;
            max-width: 400px;
            text-align: left;
            margin: 0 auto;
        }

        .feedback-form h3 {
            margin-top: 100px;
            margin-bottom: 100px;
            text-align: center;
        }

        .rating-group { margin-bottom: 1.5rem; }

        .rating-group p {
            margin: 0 0 0.5rem 0;
            font-weight: bold;
        }

        .rating-labels {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            color: #666;
            padding: 0 5px;
        }

        .rating-options {
            display: flex;
            justify-content: space-around;
            margin-top: 0.5rem;
        }

        /* ===== 左右自适应布局 ===== */
        #task-and-preview-layout {
            width: min(1800px, calc(100vw - 1rem));
            display: grid;
            grid-template-columns: minmax(900px, 2.6fr) minmax(420px, 1fr);
            gap: 1rem;
            align-items: stretch;
            margin-bottom: 0.5rem;

            height: calc(100dvh - 1.5rem);
            max-height: calc(100dvh - 1.5rem);
        }

        #task-and-preview-layout.hidden {
            display: none !important;
        }

        #task-and-preview-layout > #task-step.container {
            max-width: none;
            width: 100%;
            height: 100%;
            margin-bottom: 0;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            overflow: auto;
            min-height: 0;
        }

        #task-step h2 {
            margin-top: 0.1rem;
            margin-bottom: 0.5rem;
            text-align: left;
            flex-shrink: 0;
            font-size: 2rem;
        }

        .gesture-display,
        #live-confidence-box,
        #task-status,
        .buttons-container {
            flex-shrink: 0;
        }

        #task-status {
            font-size: 1.1rem;
            margin: 0.4rem 0 0.75rem 0;
        }

        .buttons-container {
            flex-shrink: 0;
        }

        /* ===== 右侧实时预览 ===== */
        #debug-preview-panel {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.96);
            border: 1px solid #d9dee5;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #debug-preview-title {
            font-size: 22px;
            font-weight: 800;
            color: #333;
            margin: 0 0 12px 0;
            text-align: left;
            flex-shrink: 0;
        }

        .debug-preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .debug-card {
            background: #f8f9fb;
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .debug-card-label {
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
            text-align: left;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* 图像保持自适应，不跟着文字无限变大 */
        .debug-card img {
            width: 100%;
            flex: 1;
            min-height: 0;
            object-fit: contain;
            object-position: center;
            border-radius: 8px;
            background: #111;
            display: block;
        }

        .debug-placeholder {
            width: 100%;
            flex: 1;
            min-height: 0;
            border-radius: 8px;
            background: #eef1f4;
            color: #7a7f87;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            box-sizing: border-box;
            line-height: 1.35;
        }

        /* 隐藏原本右上角小视频，但保留给识别逻辑使用 */
        #task-video-feed {
            position: absolute !important;
            left: -9999px !important;
            top: auto !important;
            right: auto !important;
            bottom: auto !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
            border: 0 !important;
            box-shadow: none !important;
            transform: scaleX(-1);
        }

        @media (max-width: 1100px) {
            #task-and-preview-layout {
                grid-template-columns: 1fr;
                height: auto;
                max-height: none;
            }

            #task-and-preview-layout > #task-step.container {
                height: auto;
                overflow: visible;
            }

            #debug-preview-panel {
                min-height: auto;
                overflow: visible;
            }

            .debug-card img,
            .debug-placeholder {
                min-height: 180px;
            }

            #gallery-container {
                min-height: 220px;
                flex: none;
            }
        }

            #task-and-preview-layout > #task-step.container {
                height: auto;
                overflow: visible;
            }

            #debug-preview-panel {
                min-height: auto;
                overflow: visible;
            }

            .debug-card img,
            .debug-placeholder {
                min-height: 180px;
            }
        }
    </style>
</head>
<body>
    <div id="wizard-step" class="container"></div>

    <div id="task-and-preview-layout" class="hidden">
        <div id="task-step" class="container hidden">
            <h2>任务A: 滑动交互</h2>
            <p class="gesture-display">使用 <strong id="gesture-display-text"></strong> 完成翻页</p>

            <div id="live-confidence-box">
                <p><span id="without-gesture-name" class="confidence-label">without perturbation · --</span>：<span id="without-confidence" class="confidence-value">--</span></p>
                <p><span id="with-gesture-name" class="confidence-label">with perturbation · --</span>：<span id="with-confidence" class="confidence-value">--</span></p>
            </div>

            <div id="gallery-container">
                <div id="image-strip"></div>
            </div>

            <p id="task-status">请依次点击开始测试。</p>

            <div class="buttons-container">
                <div class="condition-box">
                    <button id="start-baseline-button" type="button">开始模型一测试</button>
                    <div id="baseline-results" class="results"></div>
                </div>
                <div class="condition-box">
                    <button id="start-adaptaface-button" type="button">开始模型二测试</button>
                    <div id="adaptaface-results" class="results"></div>
                </div>
            </div>
        </div>

        <div id="debug-preview-panel">
            <p id="debug-preview-title">Real-time Adversarial Assistance</p>
            <div class="debug-preview-grid">
                <div class="debug-card">
                    <div class="debug-card-label">Original Image</div>
                    <img id="preview-image" alt="原始摄像头画面">
                </div>
                <div class="debug-card">
                    <div class="debug-card-label">Cropped Face Image</div>
                    <img id="cropped-face-image" alt="裁剪后的人脸图像" class="hidden">
                    <div id="cropped-face-placeholder" class="debug-placeholder">等待检测到人脸</div>
                </div>
                <div class="debug-card">
                    <div class="debug-card-label">Face Image with Perturba</div>
                    <img id="adv-face-image" alt="加入扰动后的对抗人脸图像" class="hidden">
                    <div id="adv-face-placeholder" class="debug-placeholder">当前未应用扰动</div>
                </div>
                <div class="debug-card">
                    <div class="debug-card-label">Perturbation Image</div>
                    <img id="perturbation-image" alt="扰动可视化图像" class="hidden">
                    <div id="perturbation-placeholder" class="debug-placeholder">当前未生成扰动</div>
                </div>
            </div>
        </div>
    </div>

    <div id="feedback-step" class="container hidden">
        <div class="feedback-form">
            <h3 id="feedback-title">请对刚才的体验进行评分</h3>
            <div class="rating-group">
                <p>1. 您觉得刚才的操作轻松吗？</p>
                <div class="rating-labels"><span>非常费力</span><span>非常轻松</span></div>
                <div class="rating-options">
                    <label><input type="radio" name="ease" value="1"> 1</label>
                    <label><input type="radio" name="ease" value="2"> 2</label>
                    <label><input type="radio" name="ease" value="3" checked> 3</label>
                    <label><input type="radio" name="ease" value="4"> 4</label>
                    <label><input type="radio" name="ease" value="5"> 5</label>
                </div>
            </div>
            <div class="rating-group">
                <p>2. 您觉得刚才的控制精准吗？</p>
                <div class="rating-labels"><span>非常不准</span><span>非常精准</span></div>
                <div class="rating-options">
                    <label><input type="radio" name="accuracy" value="1"> 1</label>
                    <label><input type="radio" name="accuracy" value="2"> 2</label>
                    <label><input type="radio" name="accuracy" value="3" checked> 3</label>
                    <label><input type="radio" name="accuracy" value="4"> 4</label>
                    <label><input type="radio" name="accuracy" value="5"> 5</label>
                </div>
            </div>
            <button id="submit-feedback-button" type="button">提交并继续</button>
        </div>
    </div>

    <div id="nav-step" class="container hidden">
        <div class="nav-buttons">
            <a id="next-task-link" href="#"></a>
            <a href="/">返回主页</a>
        </div>
    </div>

    <video id="task-video-feed" class="hidden" autoplay playsinline></video>
    <canvas id="canvas" class="hidden"></canvas>

    <script>
        let wizardStep, taskStep, feedbackStep, navStep, imageStrip, canvas, context, taskStatus, gestureDisplayText;
        let startBaselineButton, startAdaptafaceButton, feedbackTitle, submitFeedbackButton;
        let previewImageEl, croppedFaceImageEl, advFaceImageEl, perturbationImageEl;
        let croppedFacePlaceholderEl, advFacePlaceholderEl, perturbationPlaceholderEl;
        let taskAndPreviewLayout;
        let withoutConfidenceEl, withConfidenceEl;
        let withoutGestureNameEl, withGestureNameEl;

        const TOTAL_IMAGES = 5;
        const imageUrls = [
            ...Array.from({length: TOTAL_IMAGES}, (_, i) => `/static/images/${i + 1}.jpg`),
            "https://placehold.co/600x800/28a745/FFF?text=完成!"
        ];

        let personalizedGesture = {}, cameraStream = null, isTaskRunning = false, recognitionInterval = null, gestureCooldownMs = 700;
        let currentImageIndex = 0, gestureCount = 0, startTime = 0, isAttackEnabled = false, lastGestureTime = 0;
        let fingerprintMatchCount = 0, confidenceScores = [], confusionErrors = {};

        const AU_INFO = {
            "AU1":{"name":"眉头上扬"},
            "AU2":{"name":"眉头外扬"},
            "AU4":{"name":"Frown Eyebrows"},
            "AU6":{"name":"脸颊提肌"},
            "AU9":{"name":"皱鼻"},
            "AU12":{"name":"Smile"},
            "AU25":{"name":"Open Mouth"},
            "AU26":{"name":"下巴张开"}
        };

        function setupGalleryImages() {
            imageStrip.innerHTML = '';
            const pageWidthPercent = 100 / imageUrls.length;

            imageUrls.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'gallery-image';
                img.style.width = `${pageWidthPercent}%`;
                img.style.flex = `0 0 ${pageWidthPercent}%`;
                imageStrip.appendChild(img);
            });

            imageStrip.style.width = `${imageUrls.length * 100}%`;
        }

        function updateSlidePosition() {
            const offset = -currentImageIndex * (100 / imageUrls.length);
            imageStrip.style.transform = `translateX(${offset}%)`;
        }

        function updatePreviewPanel(result) {
            if (!result) return;

            if (result.previewImage && previewImageEl) {
                previewImageEl.src = result.previewImage;
            }

            if (result.croppedFaceImage) {
                croppedFaceImageEl.src = result.croppedFaceImage;
                croppedFaceImageEl.classList.remove('hidden');
                croppedFacePlaceholderEl.classList.add('hidden');
            } else {
                croppedFaceImageEl.classList.add('hidden');
                croppedFacePlaceholderEl.classList.remove('hidden');
            }

            if (result.adversarialFaceImage) {
                advFaceImageEl.src = result.adversarialFaceImage;
                advFaceImageEl.classList.remove('hidden');
                advFacePlaceholderEl.classList.add('hidden');
            } else {
                advFaceImageEl.classList.add('hidden');
                advFacePlaceholderEl.classList.remove('hidden');
            }

            if (result.perturbationImage) {
                perturbationImageEl.src = result.perturbationImage;
                perturbationImageEl.classList.remove('hidden');
                perturbationPlaceholderEl.classList.add('hidden');
            } else {
                perturbationImageEl.classList.add('hidden');
                perturbationPlaceholderEl.classList.remove('hidden');
            }
        }

        function selectGesture(gestureInfo) {
            personalizedGesture = gestureInfo;
            gestureDisplayText.textContent = `${gestureInfo.name}`;
            wizardStep.classList.add('hidden');
            taskStep.classList.remove('hidden');
            if (taskAndPreviewLayout) taskAndPreviewLayout.classList.remove('hidden');

            startBaselineButton = document.getElementById('start-baseline-button');
            startAdaptafaceButton = document.getElementById('start-adaptaface-button');
            startBaselineButton.onclick = () => startTask(false);
            startAdaptafaceButton.onclick = () => startTask(true);

            const taskVideoFeed = document.getElementById('task-video-feed');
            if (cameraStream) {
                taskVideoFeed.srcObject = cameraStream;
            } else {
                navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                    cameraStream = stream;
                    taskVideoFeed.srcObject = stream;
                }).catch(err => {
                    console.error("摄像头访问失败:", err);
                    alert(`无法启动摄像头，请检查权限或浏览器设置。\n\n错误详情: ${err.name}\n${err.message}`);
                });
            }
            taskVideoFeed.classList.remove('hidden');
        }

        function startTask(useAttack) {
            if (isTaskRunning) return;
            if (recognitionInterval) {
                clearInterval(recognitionInterval);
                recognitionInterval = null;
            }

            fingerprintMatchCount = 0;
            confidenceScores = [];
            confusionErrors = {};
            gestureCount = 0;
            currentImageIndex = 0;
            isTaskRunning = true;
            isAttackEnabled = useAttack;
            updateSlidePosition();
            taskStatus.textContent = `任务开始！请翻页浏览 ${TOTAL_IMAGES} 张照片。`;

            // 重置显示
            if (withoutConfidenceEl) withoutConfidenceEl.textContent = '--';
            if (withConfidenceEl) withConfidenceEl.textContent = '--';

            const speedToIntervalMap = { 1: 500, 2: 400, 3: 300, 4: 250, 5: 200 };
            let recognitionIntervalMs = 300;
            const savedSettings = JSON.parse(localStorage.getItem('attackSettings'));

            if (savedSettings) {
                if (savedSettings.speedLevel) {
                    recognitionIntervalMs = speedToIntervalMap[savedSettings.speedLevel];
                }
                if (savedSettings.cooldownTime) {
                    gestureCooldownMs = savedSettings.cooldownTime;
                }
            }

            const currentButton = useAttack ? startAdaptafaceButton : startBaselineButton;
            const otherButton = useAttack ? startBaselineButton : startAdaptafaceButton;
            otherButton.disabled = true;
            currentButton.textContent = '停止测试';
            currentButton.classList.add('btn-stop');
            currentButton.onclick = () => stopTask();

            (useAttack ? document.getElementById('adaptaface-results') : document.getElementById('baseline-results')).innerHTML = '';
            startTime = Date.now();
            recognitionInterval = setInterval(sendFrame, recognitionIntervalMs);
        }

        function stopTask() {
            endTask(true);
        }

        function nextImage() {
            if (!isTaskRunning) return;
            gestureCount++;
            if (currentImageIndex < TOTAL_IMAGES) {
                currentImageIndex++;
                updateSlidePosition();
                if (currentImageIndex === TOTAL_IMAGES) {
                    setTimeout(() => endTask(false), 500);
                } else {
                    taskStatus.textContent = `很好！已浏览 ${currentImageIndex}/${TOTAL_IMAGES}`;
                }
            }
        }

        function endTask(stoppedManually = false) {
            if (!isTaskRunning) return;
            isTaskRunning = false;

            if (recognitionInterval) {
                clearInterval(recognitionInterval);
                recognitionInterval = null;
            }

            taskStatus.textContent = stoppedManually ? '测试已手动停止。' : '任务完成！';

            const totalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            const completionRate = (TOTAL_IMAGES > 0 ? (currentImageIndex / TOTAL_IMAGES) * 100 : 0).toFixed(1);
            const accuracy = (gestureCount > 0 ? (currentImageIndex / gestureCount) * 100 : 0).toFixed(1);
            const avgTime = (gestureCount > 0 ? totalTime / gestureCount : 0).toFixed(2);
            const avgConfidence = (confidenceScores.length > 0)
                ? (confidenceScores.reduce((a, b) => a + b, 0) / confidenceScores.length)
                : 0;
            const stdDevConfidence = (confidenceScores.length > 1)
                ? Math.sqrt(confidenceScores.map(x => Math.pow(x - avgConfidence, 2)).reduce((a, b) => a + b, 0) / (confidenceScores.length - 1))
                : 0;

            const results = {
                '总时间(秒)': totalTime,
                '准确率(%)': accuracy,
                '总尝试(次)': gestureCount,
                '平均耗时(秒)': avgTime,
                '完成率(%)': completionRate,
                '平均置信度': avgConfidence.toFixed(4),
                '置信度标准差': stdDevConfidence.toFixed(4),
                '混淆错误': confusionErrors
            };

            if (personalizedGesture.mode === 'au_vector') {
                results['指纹配对成功次数'] = fingerprintMatchCount;
            }

            fetch('/log_results', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    taskName: '照片画廊',
                    mode: new URLSearchParams(window.location.search).get('mode'),
                    gestureName: personalizedGesture.name,
                    condition: isAttackEnabled ? 'AdaptaFace' : '基线',
                    results: results
                })
            }).catch(error => console.error('结果日志记录失败:', error));

            const currentButton = isAttackEnabled ? startAdaptafaceButton : startBaselineButton;
            currentButton.textContent = '测试已完成';
            currentButton.disabled = true;
            currentButton.classList.remove('btn-stop');
            currentButton.onclick = null;

            showFeedbackForm();
        }

        function showFeedbackForm() {
            const conditionName = isAttackEnabled ? '模型二' : '模型一';
            feedbackTitle.textContent = `请对刚才 “${conditionName}” 的体验评分`;
            taskStep.classList.add('hidden');
            if (taskAndPreviewLayout) taskAndPreviewLayout.classList.add('hidden');
            feedbackStep.classList.remove('hidden');
            document.querySelector('input[name="ease"][value="3"]').checked = true;
            document.querySelector('input[name="accuracy"][value="3"]').checked = true;
        }

        function submitFeedback() {
            const easeRating = document.querySelector('input[name="ease"]:checked').value;
            const accuracyRating = document.querySelector('input[name="accuracy"]:checked').value;
            const feedbackData = {
                '使用轻松度': parseInt(easeRating),
                '控制精准度': parseInt(accuracyRating)
            };

            fetch('/log_feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    taskName: '照片画廊',
                    mode: new URLSearchParams(window.location.search).get('mode'),
                    gestureName: personalizedGesture.name,
                    condition: isAttackEnabled ? 'AdaptaFace' : '基线',
                    feedback: feedbackData
                })
            }).catch(error => console.error('反馈日志记录失败:', error));

            continueToNextStep();
        }

        function continueToNextStep() {
            feedbackStep.classList.add('hidden');
            const otherButton = isAttackEnabled ? startBaselineButton : startAdaptafaceButton;

            if (otherButton && otherButton.textContent !== '测试已完成') {
                otherButton.disabled = false;
                otherButton.textContent = `开始${!isAttackEnabled ? '模型二' : '模型一'}测试`;
                taskStep.classList.remove('hidden');
                if (taskAndPreviewLayout) taskAndPreviewLayout.classList.remove('hidden');
            } else {
                taskStep.classList.add('hidden');
                if (taskAndPreviewLayout) taskAndPreviewLayout.classList.add('hidden');
                navStep.classList.remove('hidden');
            }
        }

        async function sendFrame() {
            if (!isTaskRunning) return;

            const taskVideoFeed = document.getElementById('task-video-feed');
            if (!taskVideoFeed.srcObject || taskVideoFeed.readyState < 2) return;

            if (canvas.width !== taskVideoFeed.videoWidth) {
                canvas.width = taskVideoFeed.videoWidth;
                canvas.height = taskVideoFeed.videoHeight;
            }

            context.drawImage(taskVideoFeed, 0, 0, canvas.width, canvas.height);
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.7);

            let requestBody = {
                image: imageDataUrl,
                attackEnabled: isAttackEnabled,
                ...personalizedGesture
            };

            if (isAttackEnabled) {
                const savedSettings = JSON.parse(localStorage.getItem('attackSettings'));
                requestBody.attackParams = savedSettings || { eps: 8, alpha: 3, steps: 3 };
            }

            try {
                const response = await fetch('/process_frame', {
                    method: 'POST',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!isTaskRunning) return;
                const result = await response.json();

                updatePreviewPanel(result);

                if (result.fingerprintMatch) {
                    fingerprintMatchCount++;
                }

                const targetGesture = personalizedGesture.au || personalizedGesture.target_au;
                const targetGestureName =
                    personalizedGesture.name ||
                    AU_INFO[targetGesture]?.name ||
                    targetGesture ||
                    '--';

                if (withoutGestureNameEl) {
                    withoutGestureNameEl.textContent = `without perturbation · ${targetGestureName}`;
                }
                if (withGestureNameEl) {
                    withGestureNameEl.textContent = `with perturbation · ${targetGestureName}`;
                }

                // 只认新的前后分数，不再 fallback 到旧的 result.confidences
                const baselineConfidences = result.baselineConfidences || {};
                const finalConfidences = result.finalConfidences || {};

                if (withoutConfidenceEl) {
                    const withoutScore = baselineConfidences[targetGesture];
                    withoutConfidenceEl.textContent =
                        (typeof withoutScore === 'number') ? withoutScore.toFixed(4) : '--';
                }

                if (withConfidenceEl) {
                    const withScore =
                        (isAttackEnabled && result.attackApplied)
                            ? finalConfidences[targetGesture]
                            : null;

                    withConfidenceEl.textContent =
                        (typeof withScore === 'number') ? withScore.toFixed(4) : '--';
                }

                // 识别判定仍然兼容旧返回
                const decisionConfidences = result.finalConfidences || result.confidences || {};
                const targetDecisionScore = decisionConfidences[targetGesture];

                if (result.status === 'success' && result.gesture === targetGesture) {
                    const now = Date.now();
                    if (now - lastGestureTime > gestureCooldownMs) {
                        lastGestureTime = now;
                        if (typeof targetDecisionScore === 'number') {
                            confidenceScores.push(targetDecisionScore);
                        }
                        nextImage();
                    }
                } else if (result.status === 'success' && result.gesture !== 'None' && result.gesture !== 'NoFace') {
                    const misidentifiedGesture = result.gesture;
                    confusionErrors[misidentifiedGesture] = (confusionErrors[misidentifiedGesture] || 0) + 1;
                }
            } catch (error) {
                if (isTaskRunning) {
                    console.error('发送失败:', error);
                }
            }
        }

        async function startRecordingProcess(gestureInfo, isCustomSmart=false) {
            const webcam = document.getElementById('webcam');
            const wizardStatus = document.getElementById('wizard-status');
            const recordButton = document.getElementById('record-button');

            if (recordButton) recordButton.disabled = true;

            if (!webcam.srcObject || webcam.videoWidth === 0) {
                wizardStatus.textContent = "正在准备摄像头...";
                await new Promise(r => setTimeout(r, 1000));
                if (!webcam.srcObject || webcam.videoWidth === 0) {
                    wizardStatus.textContent = "错误：无法获取摄像头画面尺寸，请刷新重试。";
                    if (recordButton) recordButton.disabled = false;
                    return;
                }
            }

            canvas.width = webcam.videoWidth;
            canvas.height = webcam.videoHeight;
            wizardStatus.textContent = '请准备做动作';
            await new Promise(r => setTimeout(r, 1500));

            wizardStatus.classList.add('countdown-active');
            for (let i = 3; i > 0; i--) {
                wizardStatus.textContent = i;
                await new Promise(r => setTimeout(r, 1000));
            }
            wizardStatus.classList.remove('countdown-active');

            wizardStatus.textContent = '正在拍摄...请保持动作...';
            const frames = [];
            for (let i = 0; i < 5; i++) {
                context.drawImage(webcam, 0, 0, canvas.width, canvas.height);
                frames.push(canvas.toDataURL('image/jpeg', 0.7));
                await new Promise(r => setTimeout(r, 100));
            }

            wizardStatus.textContent = '✅ 已捕捉动作！';

            if (isCustomSmart) {
                sendForAnalysisAndTemplateCreation(gestureInfo, frames);
            } else {
                sendAuVectorTemplateToBackend(gestureInfo, frames);
            }
        }

        async function sendForAnalysisAndTemplateCreation(gestureInfo, gesture_frames) {
            const wizardStatus = document.getElementById('wizard-status');
            const recordButton = document.getElementById('record-button');

            try {
                const response = await fetch('/analyze_and_create_template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gesture_frames })
                });

                const result = await response.json();

                if (response.ok) {
                    wizardStatus.textContent = `模板创建成功！系统已为您自动匹配最相似的目标：“${result.determined_au_name}”。`;
                    const customName = prompt("太棒了！请为您的新手势命名:", "我的独特手势");
                    let finalGestureInfo = {
                        mode: 'au_vector',
                        name: customName || "自定义手势",
                        target_au: result.determined_au
                    };
                    setTimeout(() => selectGesture(finalGestureInfo), 1500);
                } else {
                    wizardStatus.textContent = `创建失败: ${result.message}`;
                    if (recordButton) recordButton.disabled = false;
                }
            } catch (error) {
                wizardStatus.textContent = '创建模板时连接后台失败。';
                if (recordButton) recordButton.disabled = false;
            }
        }

        async function sendAuVectorTemplateToBackend(gestureInfo, gesture_frames) {
            const wizardStatus = document.getElementById('wizard-status');
            const recordButton = document.getElementById('record-button');
            const target_au = gestureInfo.au || gestureInfo.target_au;

            try {
                const response = await fetch('/create_au_vector_template', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_au, gesture_frames })
                });

                const result = await response.json();

                if (response.ok) {
                    wizardStatus.textContent = '模板创建成功！准备开始任务...';
                    let finalGestureInfo;

                    if (gestureInfo.mode === 'au') {
                        finalGestureInfo = { ...gestureInfo, mode: 'au_vector', target_au: target_au };
                    } else {
                        const customName = prompt("太棒了！请为您的新手势命名:", "我的独特手势");
                        finalGestureInfo = {
                            ...gestureInfo,
                            name: customName || "自定义手势",
                            mode: 'au_vector',
                            target_au: target_au
                        };
                    }

                    setTimeout(() => selectGesture(finalGestureInfo), 1000);
                } else {
                    wizardStatus.textContent = `创建失败: ${result.message}`;
                    if (recordButton) recordButton.disabled = false;
                }
            } catch (error) {
                wizardStatus.textContent = '创建模板时连接后台失败。';
                if (recordButton) recordButton.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            wizardStep = document.getElementById('wizard-step');
            taskStep = document.getElementById('task-step');
            feedbackStep = document.getElementById('feedback-step');
            navStep = document.getElementById('nav-step');
            taskAndPreviewLayout = document.getElementById('task-and-preview-layout');

            imageStrip = document.getElementById('image-strip');
            canvas = document.getElementById('canvas');
            context = canvas.getContext('2d');
            taskStatus = document.getElementById('task-status');
            gestureDisplayText = document.getElementById('gesture-display-text');
            feedbackTitle = document.getElementById('feedback-title');
            submitFeedbackButton = document.getElementById('submit-feedback-button');
            submitFeedbackButton.onclick = submitFeedback;

            previewImageEl = document.getElementById('preview-image');
            croppedFaceImageEl = document.getElementById('cropped-face-image');
            advFaceImageEl = document.getElementById('adv-face-image');
            perturbationImageEl = document.getElementById('perturbation-image');
            croppedFacePlaceholderEl = document.getElementById('cropped-face-placeholder');
            advFacePlaceholderEl = document.getElementById('adv-face-placeholder');
            perturbationPlaceholderEl = document.getElementById('perturbation-placeholder');

            withoutConfidenceEl = document.getElementById('without-confidence');
            withConfidenceEl = document.getElementById('with-confidence');
            withoutGestureNameEl = document.getElementById('without-gesture-name');
            withGestureNameEl = document.getElementById('with-gesture-name');

            setupGalleryImages();

            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode') || 'fixed';
            const nextTaskLink = document.getElementById('next-task-link');

            if (mode === 'fixed') {
                nextTaskLink.href = '/gallery?mode=selectable';
                nextTaskLink.textContent = '下一个模式 (选择动作)';
            } else if (mode === 'selectable') {
                nextTaskLink.href = '/gallery?mode=custom_fixed';
                nextTaskLink.textContent = '下一个模式 (自定义-固定)';
            } else if (mode === 'custom_fixed') {
                nextTaskLink.href = '/gallery?mode=custom_smart';
                nextTaskLink.textContent = '下一个模式 (自定义-智能)';
            } else if (mode === 'custom_smart') {
                nextTaskLink.href = '/zoom?action=in&mode=fixed';
                nextTaskLink.textContent = '下一个任务 (缩放)';
            }

            wizardStep.innerHTML = `<div id="wizard-content"></div><p id="wizard-status"></p><video id="webcam" autoplay playsinline class="hidden"></video>`;

            const wizardContent = document.getElementById('wizard-content');
            const webcam = document.getElementById('webcam');
            const wizardStatus = document.getElementById('wizard-status');

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcam.srcObject = cameraStream;
                webcam.classList.remove('hidden');
                wizardStatus.textContent = '摄像头已就绪。';
            } catch (err) {
                wizardStatus.textContent = '错误：无法访问摄像头，请检查浏览器权限并刷新页面。';
                alert(`无法启动摄像头，请检查权限或浏览器设置。\n\n错误详情: ${err.name}\n${err.message}`);
                return;
            }

            if (mode === 'fixed') {
                const gestureInfo = { mode: 'au', au: 'AU4', name: 'Frown Eyebrows' };
                wizardContent.innerHTML = `<h2>第一步：录制您的个人动作</h2><p>请对准摄像头做出 <strong>${gestureInfo.name}</strong> 动作，并点击下方按钮<strong>进行录制</strong>，按下按钮后将有3秒倒计时</p><button id="record-button" type="button">录制“${gestureInfo.name}”</button>`;
                document.getElementById('record-button').onclick = () => startRecordingProcess(gestureInfo);
            } else if (mode === 'selectable') {
                wizardContent.innerHTML = `<h2>第一步：选择并录制您的动作</h2><p>请选择一个您想要用来做‘翻页’交互的动作，然后根据提示完成录制。<strong>（录制期间请保持该动作）</strong></p><div id="au-buttons-container" class="au-buttons-container"></div>`;
                const container = document.getElementById('au-buttons-container');

                Object.keys(AU_INFO).forEach(au => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    const gestureInfo = { mode: 'au', au: au, name: AU_INFO[au].name };
                    button.textContent = AU_INFO[au].name;
                    button.className = 'au-button';
                    button.onclick = () => {
                        wizardContent.innerHTML = `<h2>现在，请录制您的“${gestureInfo.name}”动作</h2><p>请正对摄像头，做出您刚才选择的动作，并点击下方按钮录制（录制期间请保持该动作）。</p><button id="record-button" type="button">开始录制</button>`;
                        document.getElementById('record-button').onclick = () => startRecordingProcess(gestureInfo);
                    };
                    container.appendChild(button);
                });
            } else if (mode === 'custom_fixed') {
                const gestureInfo = { mode: 'custom_fixed', target_au: 'AU4' };
                wizardContent.innerHTML = `<h2>录制自定义动作 (固定目标)</h2><p style="text-align: left;">请创造一个您自己专属的、舒适的面部动作触发“翻页”的指令。并点击下方按钮录制（录制期间请保持该动作）。</p><button id="record-button" type="button">录制我的独特动作</button>`;
                document.getElementById('record-button').onclick = () => startRecordingProcess(gestureInfo);
            } else if (mode === 'custom_smart') {
                const gestureInfo = { mode: 'custom_smart' };
                wizardContent.innerHTML = `<h2>录制自定义动作 (智能匹配目标)</h2><p style="text-align: left;">请创造一个您自己专属的、舒适的面部动作触发“翻页”指令。系统会自动为您匹配最佳的辅助目标以提高成功率。<strong>（录制期间请保持该动作）</strong></p><button id="record-button" type="button">录制我的独特动作</button>`;
                document.getElementById('record-button').onclick = () => startRecordingProcess(gestureInfo, true);
            }
        });
    </script>
</body>
